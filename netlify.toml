# Configuração de Deploy Automático do Netlify
# Cantinho da Luci - Landing Page

[build]
  # Comando para fazer o build do projeto Next.js
  command = "npm install && npm run build"

  # Diretório de publicação (.next para Next.js com SSR/SSG)
  publish = ".next"

  # Gerenciador de pacotes
  package_manager = "npm"

[build.environment]
  # Versão do Node.js
  NODE_VERSION = "20"

  # Variáveis de ambiente para otimização
  NEXT_TELEMETRY_DISABLED = "1"
  NPM_FLAGS = "--legacy-peer-deps"

# Plugin do Next.js para Netlify (habilita SSR, ISR, API Routes)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Headers para otimização de cache e segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache de assets estáticos (imagens, CSS, JS)
[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect de WWW para domínio raiz (quando configurar domínio customizado)
# [[redirects]]
#   from = "https://www.cantinhodoluci.com.br/*"
#   to = "https://cantinhodoluci.com.br/:splat"
#   status = 301
#   force = true

# Context-specific builds (deploy previews)
[context.production]
  command = "npm install && npm run build"

[context.deploy-preview]
  command = "npm install && npm run build"

[context.branch-deploy]
  command = "npm install && npm run build"

# Configurações adicionais de deploy
[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 3000
  publish = ".next"
  autoLaunch = false
